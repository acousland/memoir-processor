name: MemoirProcessor
options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: 15.0
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    exactVersion: 0.18.0
targets:
  MemoirProcessorCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/MemoirProcessorCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.memoir.processor.core
        DEFINES_MODULE: YES
        CODE_SIGNING_ALLOWED: NO
        OTHER_LDFLAGS:
          - -lsqlite3

  MemoirProcessorAgent:
    type: tool
    platform: macOS
    sources:
      - path: Sources/MemoirProcessorAgent
    resources:
      - path: worker
        type: folder
      - path: proxy
        type: folder
    dependencies:
      - target: MemoirProcessorCore
      - package: WhisperKit
        product: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.memoir.processor.agent
        CODE_SIGNING_ALLOWED: NO
        OTHER_LDFLAGS:
          - -lsqlite3
        INFOPLIST_FILE: ""

  MemoirProcessorApp:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Sources/MemoirProcessorApp
    resources:
      - path: Bundle/AppIcon.icns
      - path: worker
        type: folder
      - path: proxy
        type: folder
    dependencies:
      - target: MemoirProcessorCore
      - target: MemoirProcessorAgent
        embed: false
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.memoir.processor.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGNING_ALLOWED: NO
        MARKETING_VERSION: 1.1.2
        CURRENT_PROJECT_VERSION: 2026101903
        PRODUCT_NAME: Memoir Processor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    postBuildScripts:
      - name: Bundle Agent
        script: |
          set -euo pipefail
          APP_DIR="${TARGET_BUILD_DIR}/${FULL_PRODUCT_NAME}"
          mkdir -p "${APP_DIR}/Contents/MacOS"
          mkdir -p "${APP_DIR}/Contents/Resources"
          cp "${PROJECT_DIR}/Bundle/AppIcon.icns" "${APP_DIR}/Contents/Resources/AppIcon.icns"
          cp "${BUILT_PRODUCTS_DIR}/MemoirProcessorAgent" "${APP_DIR}/Contents/MacOS/MemoirProcessorAgent"
          chmod +x "${APP_DIR}/Contents/MacOS/MemoirProcessorAgent"
          rm -rf "${APP_DIR}/Contents/Resources/worker"
          cp -R "${PROJECT_DIR}/worker" "${APP_DIR}/Contents/Resources/worker"
          rm -rf "${APP_DIR}/Contents/Resources/proxy"
          cp -R "${PROJECT_DIR}/proxy" "${APP_DIR}/Contents/Resources/proxy"

  MemoirProcessorCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MemoirProcessorCoreTests
    dependencies:
      - target: MemoirProcessorCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.memoir.processor.core.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

schemes:
  MemoirProcessorApp:
    build:
      targets:
        MemoirProcessorApp: all
        MemoirProcessorAgent: all
    run:
      executable: MemoirProcessorApp
    test:
      targets:
        - MemoirProcessorCoreTests
  MemoirProcessorAgent:
    build:
      targets:
        MemoirProcessorAgent: all
